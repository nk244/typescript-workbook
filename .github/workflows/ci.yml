# 第23章で説明している CI の実例。GitHub に置けばそのまま動きます。
name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: テスト
        run: npm test
